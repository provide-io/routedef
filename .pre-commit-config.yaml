repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff-check
        args: [--exit-non-zero-on-fix]
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]

  - repo: local
    hooks:
      - id: max-loc
        name: python max loc
        entry: uv run python scripts/check_max_loc.py --max-lines 500 --roots .
        language: system
        pass_filenames: false
        always_run: true

      - id: spdx-headers
        name: Provide.io SPDX headers
        entry: uv run python scripts/check_spdx_headers.py src tests scripts
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: licenses
        name: license compliance
        entry: uv run python scripts/check_licenses.py
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy strict
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: ty
        name: ty check
        entry: uv run ty check src tests
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: bandit
        name: bandit
        entry: uv run bandit -r src -ll
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: pip-audit
        name: pip-audit vulnerability scan
        entry: uv run python -m pip_audit
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: xenon
        name: xenon complexity
        entry: uv run python scripts/check_xenon.py --max-absolute C --max-modules B --max-average A --paths src/routedef
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: vulture
        name: vulture dead code
        entry: uv run vulture --min-confidence 80 src tests
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: mutation-sweep
        name: mutmut gate (manual)
        entry: uv run python scripts/mutation_gate.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        types: [python]

      - id: cloudflare-worker-integration
        name: Cloudflare Python Worker integration (manual)
        entry: uv run python scripts/check_cloudflare_worker.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: build-install-smoke
        name: build and install smoke (manual)
        entry: uv run python scripts/check_build_install.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
