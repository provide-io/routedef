repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]

  - repo: local
    hooks:
      - id: max-loc
        name: python max loc
        entry: uv run python -c "import pathlib, sys; bad=[str(p) for root in ('src','tests') for p in pathlib.Path(root).rglob('*.py') if sum(1 for _ in p.open(encoding='utf-8')) > 500]; print('\\n'.join(bad)); sys.exit(bool(bad))"
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: mypy
        name: mypy strict
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: ty
        name: ty check
        entry: uv run ty check src tests
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: bandit
        name: bandit
        entry: uv run bandit -r src -ll
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: pip-audit
        name: pip-audit vulnerability scan
        entry: uv run python -m pip_audit --path .
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: xenon
        name: xenon complexity
        entry: uv run xenon --max-absolute C --max-modules B --max-average A src tests
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: vulture
        name: vulture dead code
        entry: uv run vulture --min-confidence 80 src tests
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: mutation-sweep
        name: mutmut gate (manual)
        entry: uv run mutmut run
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        types: [python]
