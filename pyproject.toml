[project]
name = "routedef"
dynamic = ["version"]
description = "Route definition primitives for Python services."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "provide.io llc" }]
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.116.0"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/routedef"]

[tool.hatch.build.targets.sdist]
include = [
    "/.gitignore",
    "/.ci",
    "/.pre-commit-config.yaml",
    "/.secrets.baseline",
    "/LICENSE",
    "/LICENSES",
    "/README.md",
    "/REUSE.toml",
    "/VERSION",
    "/docs",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
]
exclude = [
    "/.coverage",
    "/.mypy_cache",
    "/.mutmut-cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/dist",
    "/htmlcov",
    "/mutants",
    "/uv.lock",
    "**/__pycache__",
    "**/*.py[cod]",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "RUF", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "S", "RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/routedef --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["src/routedef"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.mutmut]
source_paths = ["src/routedef/"]
also_copy = ["VERSION", "scripts"]
pytest_add_cli_args = ["--override-ini=addopts=-q -p no:cacheprovider"]
pytest_add_cli_args_test_selection = ["tests/"]

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "codespell>=2.4.1",
    "detect-secrets>=1.5.0",
    "fastapi[standard]>=0.116.0",
    "mutmut>=3.5.0",
    "mypy>=1.18.2",
    "pip-audit>=2.9.0",
    "pre-commit>=4.3.0",
    "pymarkdownlnt>=0.9.34",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "reuse>=6.2.0",
    "ruff>=0.13.1",
    "ty>=0.0.19",
    "vulture>=2.14",
    "xenon>=0.9.3",
]
